# Deploys EyeMyHealth to the EC2 host below by SSHing in, pulling the
# latest code, and running the API directly with Node.js + pm2 - no
# Dockerfile/image build needed for it. mobile/ (the Expo app - otherwise a
# phone/simulator-only React Native app) is exported as a static web build
# and served as the landing page. nginx fronts both on NGINX_PORT: /api/*
# reverse-proxies to the API's own APP_PORT (127.0.0.1 only, never exposed
# directly), everything else serves the web build - so only one port needs
# opening in the security group. Its Postgres, however, runs in a small
# dedicated Docker container
# (postgres:16-alpine), the same way exambuddy's stack on this same host
# does - trying to share/reuse the host's native PostgreSQL install
# repeatedly hit unexplained auth failures (pg_hba.conf and cluster-identity
# issues are exactly what a dedicated, isolated container sidesteps), where
# the Docker approach has been 100% reliable across 20+ deploys of
# exambuddy on this exact host. See scripts/bootstrap-ec2.sh and the
# README's "Deploying to EC2" section.
#
# One-time setup required before this workflow can run:
#
# 1. On the EC2 instance itself, install Node.js, pm2, Docker, nginx, and
#    git (see scripts/bootstrap-ec2.sh - SSH in and run it once; safe to
#    re-run and safe on a host that already runs other apps, including one
#    that already has Docker/nginx from bootstrapping a different app).
# 2. In the EC2 instance's security group, allow inbound TCP on NGINX_PORT
#    (the app, via nginx) from the internet, and keep 22 (SSH) restricted
#    to your IP / GitHub's range as you prefer. Postgres's port is bound to
#    127.0.0.1 only, so it never needs a rule. The app's own APP_PORT isn't
#    bound to localhost at the OS level (Node's default), so don't open it
#    in the security group either - leaving it closed there is what keeps
#    it unreachable except through nginx.
# 3. In this repository's Settings -> Secrets and variables -> Actions, add
#    a repository secret named EC2_SSH_KEY containing the private key
#    (PEM) that matches the EC2 instance's key pair (the same key used by
#    other apps on this host works if it's the same instance).
# 4. Optional but recommended: add a repository secret named
#    ANTHROPIC_API_KEY to turn on real AI-based extraction (parameters,
#    reference ranges, status flags, lab/facility name, report type/date,
#    free-text notes, and any alert text - not just a bare table parser).
#    Without it, extraction falls back to a local heuristic parser that
#    only recognizes tabular "name: value" lines. Both cases handle images
#    (JPEG/PNG) via the model's vision input; a scanned (non-text) PDF page
#    still isn't rasterized by this pipeline, so it remains "Needs Review"
#    either way.
# 5. Optional: add repository secrets GOOGLE_CLIENT_ID and/or
#    APPLE_CLIENT_ID to offer "Sign in with Google"/"Sign in with Apple"
#    (each is independent - set either, both, or neither). Every user
#    always has the option to continue as a guest regardless; these just
#    let a guest identity be replaced with one that survives switching
#    devices or clearing browser storage. Neither is a secret value in the
#    usual sense (both are sent to Google/Apple from the browser on every
#    sign-in), but they're still repo secrets so they're not hardcoded and
#    can be rotated without a code change. See README's "Deploying to EC2"
#    section for where to obtain each one. "Sign in with Apple" also
#    requires HTTPS (or localhost) and the exact origin registered with
#    Apple as a Return URL - it stays hidden client-side until both are true,
#    which the plain http:// URL this workflow deploys to does not satisfy
#    on its own.
#
# server/.env (DB password, DATABASE_URL) and the myhealthpal-postgres
# container are created once, directly on the host, the first time this
# workflow runs, and are left untouched on every deploy after that (the
# container's data lives in a named Docker volume, so it survives redeploys
# and even container recreation). The nginx site config and the extraction
# provider/API key are plain config, so they're simply rewritten every
# deploy to match NGINX_PORT/APP_PORT/ANTHROPIC_API_KEY below.

name: Deploy to EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  EC2_HOST: ec2-13-250-133-109.ap-southeast-1.compute.amazonaws.com
  EC2_USER: ubuntu
  AWS_REGION: ap-southeast-1
  APP_DIR: myhealthpal
  APP_PORT: 4010
  NGINX_PORT: 5250

permissions:
  contents: read

# Multiple pushes to main in quick succession (e.g. several merged PRs) can
# trigger overlapping runs, which would otherwise race on the same EC2
# host/Postgres role - e.g. two runs each generating and setting a different
# DB password, leaving the loser's own .env pointing at a password that no
# longer works. Queue instead of running concurrently.
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          envs: APP_DIR,BRANCH,REPO_URL,APP_PORT,NGINX_PORT,PUBLIC_HOST,ANTHROPIC_API_KEY,GOOGLE_CLIENT_ID,APPLE_CLIENT_ID
          script_stop: true
          script: |
            set -euo pipefail

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "${USER:-ubuntu}"
            fi
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi
            if ! command -v psql >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y postgresql-client
            fi
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
              sudo systemctl enable --now nginx
            fi

            echo "[deploy] building mobile app for web"
            cd mobile
            npm ci
            # Same-origin "" (not a full URL) - nginx below proxies /api/ on
            # this same host/port to the API, so the web build never needs
            # to know the actual host/IP. EXPO_PUBLIC_* vars are inlined at
            # build time; client.js treats this differently from "unset".
            CI=1 EXPO_PUBLIC_API_BASE_URL= npx expo export --platform web --output-dir dist
            cd ..
            WEB_ROOT=/var/www/myhealthpal-web
            sudo rm -rf "$WEB_ROOT"
            sudo mkdir -p "$WEB_ROOT"
            sudo cp -r mobile/dist/. "$WEB_ROOT"/
            echo "[deploy] web build published to $WEB_ROOT"

            echo "[deploy] configuring nginx on port ${NGINX_PORT}"
            printf '%s\n' \
              'server {' \
              "    listen ${NGINX_PORT};" \
              '    server_name _;' \
              '' \
              '    client_max_body_size 25m;' \
              '' \
              '    location /api/ {' \
              "        proxy_pass http://127.0.0.1:${APP_PORT};" \
              '        proxy_http_version 1.1;' \
              '        proxy_set_header Host $host;' \
              '        proxy_set_header X-Real-IP $remote_addr;' \
              '        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;' \
              '        proxy_set_header X-Forwarded-Proto $scheme;' \
              '    }' \
              '' \
              "    root ${WEB_ROOT};" \
              '    location / {' \
              '        try_files $uri $uri/ /index.html;' \
              '    }' \
              '}' \
              | sudo tee /etc/nginx/sites-available/myhealthpal >/dev/null
            sudo ln -sf /etc/nginx/sites-available/myhealthpal /etc/nginx/sites-enabled/myhealthpal
            sudo nginx -t
            sudo systemctl reload nginx

            DB_CONTAINER=myhealthpal-postgres
            DB_HOST_PORT=6250

            # Trust nothing from a previous attempt - check whether the
            # *actual* running container (if any) is reachable with
            # whatever DATABASE_URL is currently in server/.env, not just
            # whether that file happens to exist. Earlier failed runs
            # (including from before this workflow used Docker at all)
            # left a server/.env on the host pointing at credentials that
            # don't match anything real - a bare "does .env exist" check
            # treated that as "already configured" and never healed it.
            # Also treat a DATABASE_URL pointing at a different port than
            # DB_HOST_PORT below as stale, so changing that value here (as
            # opposed to a broken/missing container) also self-heals on the
            # next deploy instead of silently keeping the old port alive.
            cd server
            [ -f .env ] || cp .env.example .env
            CURRENT_DB_URL=$(grep '^DATABASE_URL=' .env | cut -d= -f2-)
            cd ..

            DB_OK=0
            if sudo docker inspect "$DB_CONTAINER" >/dev/null 2>&1 \
              && [[ "$CURRENT_DB_URL" == *":${DB_HOST_PORT}/"* ]] \
              && PGCONNECT_TIMEOUT=5 psql "$CURRENT_DB_URL" -c '\q' >/dev/null 2>&1; then
              DB_OK=1
            fi

            if [ "$DB_OK" -ne 1 ]; then
              echo "[deploy] (re)creating $DB_CONTAINER with fresh credentials"
              sudo docker rm -f "$DB_CONTAINER" >/dev/null 2>&1 || true
              sudo docker volume rm myhealthpal_pgdata >/dev/null 2>&1 || true

              DB_PASS_VAL=$(openssl rand -hex 16)
              sudo docker run -d --name "$DB_CONTAINER" --restart unless-stopped \
                -e POSTGRES_DB=myhealthpal -e POSTGRES_USER=myhealthpal -e POSTGRES_PASSWORD="${DB_PASS_VAL}" \
                -p 127.0.0.1:${DB_HOST_PORT}:5432 \
                -v myhealthpal_pgdata:/var/lib/postgresql/data \
                postgres:16-alpine
              echo "[deploy] container started, waiting for it to accept connections"

              ready=0
              for i in $(seq 1 30); do
                if sudo docker exec "$DB_CONTAINER" pg_isready -U myhealthpal >/dev/null 2>&1; then
                  ready=1
                  echo "[deploy] ready after ${i}s"
                  break
                fi
                sleep 1
              done
              if [ "$ready" -ne 1 ]; then
                echo "::error::$DB_CONTAINER never reported ready after 30s"
                sudo docker logs --tail 50 "$DB_CONTAINER"
                exit 1
              fi

              echo "[deploy] writing server/.env"
              cd server
              cp .env.example .env.new
              sed -i "s#^PORT=.*#PORT=${APP_PORT}#" .env.new
              sed -i "s#^DATABASE_URL=.*#DATABASE_URL=postgres://myhealthpal:${DB_PASS_VAL}@localhost:${DB_HOST_PORT}/myhealthpal#" .env.new
              mv .env.new .env
              echo "(Re)created $DB_CONTAINER and regenerated .env."
              cd ..
            fi

            # Use real AI extraction (OCR/vision for scanned images, full
            # text-understanding for everything else - parameters, ranges,
            # lab name, report type, notes, and alerts, not just tabular
            # values) whenever an API key is configured; otherwise fall back
            # to the local heuristic parser so a deploy without the secret
            # still works. Rewritten every deploy (after the block above,
            # so it applies whether or not .env was just regenerated) so
            # setting/rotating the secret takes effect on the next push.
            echo "[deploy] configuring extraction provider"
            EXTRACTION_PROVIDER_VAL=heuristic
            if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
              EXTRACTION_PROVIDER_VAL=claude
            fi
            cd server
            sed -i "s#^ANTHROPIC_API_KEY=.*#ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}#" .env
            sed -i "s#^EXTRACTION_PROVIDER=.*#EXTRACTION_PROVIDER=${EXTRACTION_PROVIDER_VAL}#" .env

            # JWT_SECRET signs every session token (guest, Google, and Apple
            # sign-in all issue one the same way) - generate it once, the
            # first time this ever runs, and never again: regenerating it on
            # a later deploy would invalidate every signed-in user's session
            # for no reason. Appended if .env.example's own placeholder line
            # isn't there yet (a .env from before this feature existed).
            grep -q '^JWT_SECRET=' .env || echo 'JWT_SECRET=' >> .env
            if [ -z "$(grep '^JWT_SECRET=' .env | cut -d= -f2-)" ]; then
              echo "[deploy] generating JWT_SECRET (first deploy only)"
              sed -i "s#^JWT_SECRET=.*#JWT_SECRET=$(openssl rand -hex 32)#" .env
            fi

            # Google/Apple sign-in client IDs are not secrets (they're
            # embedded in every client-side sign-in request regardless), but
            # setting them as repo secrets keeps them out of the repo and
            # lets them be rotated without a code change. Unset -> that
            # sign-in option is simply hidden client-side (GET /api/auth/config).
            grep -q '^GOOGLE_CLIENT_ID=' .env || echo 'GOOGLE_CLIENT_ID=' >> .env
            grep -q '^APPLE_CLIENT_ID=' .env || echo 'APPLE_CLIENT_ID=' >> .env
            sed -i "s#^GOOGLE_CLIENT_ID=.*#GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}#" .env
            sed -i "s#^APPLE_CLIENT_ID=.*#APPLE_CLIENT_ID=${APPLE_CLIENT_ID:-}#" .env
            cd ..

            echo "[deploy] installing app dependencies"
            cd server
            npm ci --omit=dev
            npm run migrate
            # Idempotent (ON CONFLICT DO UPDATE): (re)seeds the Health
            # Parameter Registry (canonical parameters/aliases/unit
            # conversions) that normalization, dedup, dashboard pinning, and
            # insights all key off of. Safe/cheap to run on every deploy.
            npm run seed

            pm2 describe myhealthpal-server > /dev/null 2>&1 && pm2 restart myhealthpal-server --update-env || pm2 start src/index.js --name myhealthpal-server
            pm2 save

            echo "Deployed. API listening on: http://${PUBLIC_HOST}:${NGINX_PORT}"
        env:
          BRANCH: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          PUBLIC_HOST: ec2-13-250-133-109.ap-southeast-1.compute.amazonaws.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
