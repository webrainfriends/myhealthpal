# Deploys the MyHealthPal API to the EC2 host below by SSHing in, pulling
# the latest code, and running it directly with Node.js + pm2 - no Docker
# involved. See scripts/bootstrap-ec2.sh and the README's "Deploying to EC2"
# section.
#
# One-time setup required before this workflow can run:
#
# 1. On the EC2 instance itself, install Node.js, pm2, PostgreSQL, and git
#    (see scripts/bootstrap-ec2.sh - SSH in and run it once; safe to re-run
#    and safe on a host that already runs other apps).
# 2. In the EC2 instance's security group, allow inbound TCP 4010 (the app)
#    from the internet, and keep 22 (SSH) restricted to your IP / GitHub's
#    range as you prefer.
# 3. In this repository's Settings -> Secrets and variables -> Actions, add
#    a repository secret named EC2_SSH_KEY containing the private key
#    (PEM) that matches the EC2 instance's key pair (the same key used by
#    other apps on this host works if it's the same instance).
#
# Nothing else needs configuring - server/.env (DB password, DATABASE_URL)
# is generated once, directly on the host, the first time this workflow
# runs, and is left untouched on every deploy after that.

name: Deploy to EC2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  EC2_HOST: ec2-13-250-133-109.ap-southeast-1.compute.amazonaws.com
  EC2_USER: ubuntu
  AWS_REGION: ap-southeast-1
  APP_DIR: myhealthpal
  APP_PORT: 4010

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          envs: APP_DIR,BRANCH,REPO_URL,APP_PORT,PUBLIC_HOST
          script_stop: true
          script: |
            set -euo pipefail

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch "$BRANCH" "$REPO_URL" "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git reset --hard "origin/$BRANCH"

            cd server

            # Re-run (not just first-deploy) whenever .env is missing OR still
            # has the unmodified example DB password - which is exactly the
            # state a *partially* failed earlier attempt can leave behind
            # (.env copied, but an error before the credentials were set).
            # Written to a temp file and moved into place only once every
            # step below succeeds, so a failed run never leaves a half
            # configured .env for the next run to mistake as "already done".
            if [ ! -f .env ] || grep -q "myhealthpal_dev" .env; then
              cp .env.example .env.new
              DB_PASS_VAL=$(openssl rand -hex 16)
              sudo -u postgres psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'myhealthpal') THEN CREATE ROLE myhealthpal WITH LOGIN; END IF; END \$\$;"
              sudo -u postgres psql -tAc "SELECT 1 FROM pg_database WHERE datname='myhealthpal'" | grep -q 1 || sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE myhealthpal OWNER myhealthpal;"
              sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE myhealthpal WITH PASSWORD '${DB_PASS_VAL}';"
              sed -i "s#^PORT=.*#PORT=${APP_PORT}#" .env.new
              sed -i "s#^DATABASE_URL=.*#DATABASE_URL=postgres://myhealthpal:${DB_PASS_VAL}@localhost:5432/myhealthpal#" .env.new
              mv .env.new .env
              echo "Generated a fresh .env."
            fi

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
              sudo apt-get install -y nodejs
            fi
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            npm ci --omit=dev
            npm run migrate

            pm2 describe myhealthpal-server > /dev/null 2>&1 && pm2 restart myhealthpal-server --update-env || pm2 start src/index.js --name myhealthpal-server
            pm2 save

            echo "Deployed. API listening on: http://${PUBLIC_HOST}:${APP_PORT}"
        env:
          BRANCH: ${{ github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}.git
          PUBLIC_HOST: ec2-13-250-133-109.ap-southeast-1.compute.amazonaws.com
